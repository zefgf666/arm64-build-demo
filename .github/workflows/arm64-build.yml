name: ARM64交叉构建任务
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: 安装基础依赖
        run: sudo apt update && sudo apt install unzip -y

      - name: 自动配置NDK r27d
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: true # 直接把编译器加入系统PATH，无需手动拼路径

      - name: 交叉编译内核补丁
        run: |
          mkdir -p build
          cd build
          # 直接调用环境内已加入PATH的编译器，不再手写长路径
          aarch64-linux-android21-clang++ ../main.cpp -o patched_kernel_arm64

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: arm64-patched-kernel
          path: build/patched_kernel_arm64
