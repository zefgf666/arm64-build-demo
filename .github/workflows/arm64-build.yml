name: ARM64 Cross Build Task
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: # 支持手动一键触发

jobs:
  build:
    runs-on: ubuntu-latest # x86资源充足，几乎不排队
    steps:
      - name: 拉取仓库全部代码
        uses: actions/checkout@v4

      - name: 配置Android NDK环境
        uses: android-actions/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: 交叉编译生成ARM64程序
        run: |
          mkdir build
          cd build
          # 此处后续替换为你的源码编译命令即可
          echo "NDK环境就绪，可编译ARM64架构可执行文件"
