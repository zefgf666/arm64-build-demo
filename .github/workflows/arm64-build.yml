name: ARM64交叉构建任务
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: 安装基础依赖
        run: sudo apt update && sudo apt install unzip wget -y

      - name: 下载配置NDK
        run: |
          wget https://mirrors.huaweicloud.com/android-ndk/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          echo "NDK_PATH=$PWD/android-ndk-r27d" >> $GITHUB_ENV

      - name: 交叉编译内核补丁
        run: |
          mkdir -p build
          cd build
          CC=${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          CXX=${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++
          # 重点：把main.cpp改成你仓库真实的源码文件名，比如patch.cpp/kernel_patch.cpp
          $CXX ../main.cpp -o patched_kernel_arm64

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: arm64-patched-kernel
          path: build/patched_kernel_arm64
