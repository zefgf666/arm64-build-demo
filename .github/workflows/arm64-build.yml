name: ARM64 Cross Build Task
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库全部代码
        uses: actions/checkout@v4

      - name: 配置Android NDK环境
        uses: android-actions/setup-ndk@v2
        with:
          ndk-version: r27d

      - name: 交叉编译生成ARM64程序
        run: |
          mkdir -p build
          cd build
          echo "NDK环境就绪，可编译ARM64架构可执行文件"
